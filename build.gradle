plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    // 在此定义 wrapper 值，这样就不必在更新 gradlew.properties 时每次都修改
    // 切换为 Wrapper.DistributionType.ALL 会下载完整的 Gradle 源码，附带文档悬停提示
    // 但这会增加 Gradle 的文件大小。如果切换为 ALL，之后请重新运行 Gradle wrapper 任务两次
    // （通过检查 gradle/wrapper/gradle-wrapper.properties 确认 distributionUrl 是否指向 `-all`）
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version + "-" + new Date().format('yyyyMMdd')
group = mod_group_id

sourceSets.main.resources {
    // 包含数据生成器生成的资源
    srcDir('src/generated/resources')

    // 从最终输出中排除仅用于开发环境的资源
    exclude("**/*.bbmodel") // BlockBench 项目文件
    exclude("src/generated/**/.cache") // 数据生成缓存文件
}

repositories {
    // 如果下方某些依赖需要，可在此添加其他仓库
}

base {
    archivesName = "CNPC-EpicFight-Addon-CE"
}

// Mojang 在 1.21.1 中为最终用户提供了 Java 21，因此模组应面向 Java 21
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // 指定要使用的 NeoForge 版本
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // 此行可省略。Access Transformer 会被自动检测
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // 默认运行配置
    // 可根据需要调整、删除或复制
    runs {
        client {
            client()

            // 逗号分隔的要加载游戏测试的命名空间列表。空字符串 = 所有命名空间
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // 此运行配置启动 GameTestServer 并运行所有已注册的游戏测试，然后退出
        // 默认情况下，如果没有提供游戏测试，服务器将崩溃
        // 其他运行配置下的 /test 命令也默认启用游戏测试系统
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()

            // 覆盖上面 configureEach 中设置的 workingDirectory 的示例，如果要用请取消注释
            // gameDirectory = project.file('run-data')

            // 指定数据生成的 modid、输出路径和现有资源路径
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // 适用于上述所有运行配置
        configureEach {
            // 推荐的 userdev 环境日志标记
            // 可添加/删除标记，用逗号分隔
            // "SCAN": 模组扫描
            // "REGISTRIES": 注册表事件触发
            // "REGISTRYDUMP": 获取所有注册表内容
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // 推荐的控制台日志级别
            // 可设置不同级别
            // 请阅读: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // 定义模组与源码的绑定关系
        // 用于告诉游戏哪些源码属于哪个模组
        // 多模组项目应为每个模组定义一个
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// 设置名为 'localRuntime' 的依赖配置
// 应使用此配置代替 'runtimeOnly' 来声明运行时测试需要的依赖
// 这是"可选的"，不会被本模组的依赖方拉取
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // libs 中的前置模组（自动加载 libs 目录下所有 jar）
    implementation fileTree(dir: 'libs', include: '*.jar')

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}

test {
    useJUnitPlatform()
}

// 此代码块在指定的资源目标文件中展开所有声明的替换属性
// 缺少属性将导致错误。属性使用 ${} Groovy 语法展开
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_display_name       : mod_display_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_author             : mod_author,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// 将 "generateModMetadata" 的输出作为构建的输入目录
// 通过 Gradle 和 IDE 构建时均可工作
sourceSets.main.resources.srcDir generateModMetadata
// 避免手动运行 "generateModMetadata"，使其在每次项目重载时自动运行
neoForge.ideSyncTask generateModMetadata

// 使用 maven-publish 插件发布到 Maven 的示例配置
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // 使用 UTF-8 字符集编译 Java
}

// IDEA 不再自动下载依赖的源码/javadoc jar，因此需要显式启用此行为
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
