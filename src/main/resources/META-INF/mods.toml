# This is an example mods.toml file. It contains the data relating to the loading mods.
# There are several mandatory fields (#mandatory), and many more that are optional (#optional).
# The overall format is standard TOML format, v0.5.0.
# Note that there are a couple of TOML lists in this file.
# Find more information on toml format here:  https://github.com/toml-lang/toml

# The name of the mod loader type to load - for regular FML @Mod mods it should be javafml
modLoader="javafml" #mandatory

# A version range to match for said mod loader - for regular FML @Mod it will be the forge version
loaderVersion="[47,)" #mandatory (24 is current forge version)

# A URL to refer people to when problems occur with this mod
issueTrackerURL="http://my.issue.tracker/" #optional

license="CC BY-NC"

# A list of mods - how many allowed here is determined by the individual mod loader
[[mods]] #mandatory
    modId="cnpcefaddon" #mandatory
    version="${file.jarVersion}" #mandatory
    displayName="CNPC-EpicFight-Addon-CE-1.20.1-Forge" #mandatory
    #updateJSONURL="" #optional
    displayURL="" #optional
    #logoFile="" #optional
    #credits="" #optional
    authors="Goodbird" #optional
    description='''
A compatibility bridge between CustomNPCs and EpicFight
    '''

[[dependencies.cnpcefaddon]] #optional
    modId="forge" #mandatory
    mandatory=true #mandatory
    versionRange="[47,)" #mandatory
    ordering="NONE"
    side="BOTH"
[[dependencies.cnpcefaddon]]
    modId="minecraft"
    mandatory=true
    versionRange="[1.20.1,1.21)"
    ordering="NONE"
    side="BOTH"
[[dependencies.cnpcefaddon]]
    modId="epicfight"
    mandatory=true
    versionRange="[20.14.11,)"
    ordering="AFTER"
    side="BOTH"
# Optional ordering hint: when EpicFight-Extra is installed, load this addon AFTER it so
# our bundled vanilla biped armature resources override its modified ones. Not a hard
# dependency: the mod works fine without epicfightx.
[[dependencies.cnpcefaddon]]
    modId="epicfightx"
    mandatory=false
    versionRange="[0,)"
    ordering="AFTER"
    side="BOTH"
# Optional: when Curios is installed, NPCs using an Epic Fight model also render their
# accessories. EpicFight ships the accessory adapter but only installs it on the player
# renderer, so this addon installs the same adapter on its NPC renderers.
# Loaded AFTER curios so its renderer registry exists before NPC renderers are built.
[[dependencies.cnpcefaddon]]
    modId="curios"
    mandatory=false
    versionRange="[0,)"
    ordering="AFTER"
    side="CLIENT"
[[dependencies.cnpcefaddon]]
    modId="cnpccurios"
    mandatory=false
    versionRange="[0,)"
    ordering="AFTER"
    side="BOTH"
